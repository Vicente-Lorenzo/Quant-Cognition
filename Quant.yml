name: Quant
channels:
    - conda-forge
    - bloomberg
    - defaults
dependencies:
    - python=3.12
    - pip

    - tqdm
    - wheel
    - pytest
    - pythonnet
    - setuptools

    - pyarrow
    - numpy
    - pandas
    - polars
    - panel
    - bokeh
    - altair
    - hvplot
    - seaborn
    - holoviews
    - matplotlib
    - networkx

    - pillow
    - selenium
    - jupyter
    - notebook
    - ipykernel
    - ipywidgets

    - pymssql
    - oracledb
    - psycopg

    - ta-lib
    - blpapi
    - xlwings
    - yfinance
    - xbbg

    - dash
    - dash-extensions
    - dash-bootstrap-components
    - fastapi
    - flask

    - gymnasium

    - pip:
        - --extra-index-url https://download.pytorch.org/whl/cu121
        - torch
        - torchvision
        - torchaudio
        - ctrader-open-api